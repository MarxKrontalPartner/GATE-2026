[project]
name = "gate-startpunkt-backend"
version = "0.0.0"
description = "Backend des GATE-Startpunkts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0.0",
    "djangorestframework>=3.16.0,<4.0.0",
    "django-cors-headers>=4.7.0,<5.0.0",
    "pillow>=11.3.0,<12.0.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.11.1,<5.0.0",
    "pytest>=8.3.0,<10.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-s --ds=core.assetverwaltung.tests.settings_test"
DJANGO_SETTINGS_MODULE = "core.assetverwaltung.tests.settings_test"
